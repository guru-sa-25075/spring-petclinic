name: Deploy and Test Cluster

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'

jobs:
  deploy-and-test-cluster:
    runs-on: ubuntu-latest
    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      CHANGE_MONITOR_ENV: deploy-and-test-cluster
      CHANGE_MONITOR_SERVICE: petclinic
      DEPLOY_SOURCE_URI: https://github.com/guru-sa-25075/spring-petclinic
      DEPLOY_VERSION: ${{ github.sha }}
      CHANGE_MONITOR_ACTOR: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - name: Report deployment start to Cursor Rollouts
        continue-on-error: true
        run: |
          bash .github/scripts/report-deployment.sh bootstrap
          bash .github/scripts/report-deployment.sh start

      - name: Deploy application
        id: deploy
        run: |
          kubectl apply -f k8s/

      - name: Wait for Pods to be ready
        id: wait
        run: |
          kubectl wait --for=condition=ready pod -l app=demo-db --timeout=180s
          kubectl wait --for=condition=ready pod -l app=petclinic --timeout=180s

      - name: Report deployment result to Cursor Rollouts
        if: always()
        continue-on-error: true
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
        run: bash .github/scripts/report-deployment.sh finish

